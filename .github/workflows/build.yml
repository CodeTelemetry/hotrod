name: Go
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.1'
      - run: npm install --global yarn@1.22.22
      - name: Rebuild frontend and Go binary from source
        run: make build
      - name: Unit tests
        run: go test -count=1 -v ./...
      - name: Static checks
        run: go vet ./...
      # Live integration/browser evidence is supplied by the benchmark runner
      # and assessed separately by the required CodeTelemetry validation gate.
      # This private fixture does not publish to upstream's registry or cluster.
