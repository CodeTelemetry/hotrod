name: Go
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts
      - run: npm install --global yarn@1.22.22
      - name: Publication and harness checks
        run: npm run test:harness
      - name: Rebuild frontend and Go binary from source
        run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Static checks
        run: npm run lint
      # Live integration/browser evidence is supplied by the benchmark runner
      # and assessed separately by the required CodeTelemetry validation gate.
      # Public CI has no registry, cluster or CodeTelemetry ingest credentials.
