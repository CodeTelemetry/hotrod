# CodeTelemetry PR gate: generated by CodeTelemetry for one workspace.
# Docs: https://codetelemetry.com/docs/integrations/github-pr-gate
#
# Asks CodeTelemetry whether the coding session(s) behind this pull request met
# the workspace's validation policy, then passes or fails on the answer.
# Require the check "codetelemetry/validation" in branch protection or a ruleset.
#
# Security:
# - Authenticates with a short-lived OIDC token that GitHub mints for this run.
#   No personal access token and no repository secret are involved.
# - Never checks out or runs code from the pull request. That is what makes
#   pull_request_target safe here: it runs this file as it is on the default
#   branch, so a pull request cannot change its own gate, and pull requests
#   from forks get a token too.
# - The only permission is id-token: write.
#
# GitHub Actions execution policy (separate from the required-check ruleset):
# - On 2026-11-02 GitHub enforces its default pull_request_target block for
#   affected public repositories. OIDC and no-checkout do not exempt this job.
# - In Settings > Actions > Policies, explicitly allow pull_request_target in
#   an active event policy scoped to .github/workflows/codetelemetry-pr-gate.yml.
# - Applicable organization/enterprise restrictions still apply. Actor rules
#   must admit the intended contributors and bots, including fork PR authors.
# - This particular default excludes private/internal repositories; explicit
#   event or actor restrictions can still block them.
# - If no job starts, inspect Actions > Policy insights. CodeTelemetry receives
#   no request and cannot diagnose a blocked run from inside this workflow.
#   Keep the required check; do not bypass it or substitute pull_request/PATs.
# - Admin guide: https://docs.github.com/en/actions/how-tos/administer/control-workflow-execution
name: CodeTelemetry PR gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write

concurrency:
  group: codetelemetry-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validation:
    name: codetelemetry/validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ask CodeTelemetry for the verdict
        env:
          CODETELEMETRY_URL: "https://codetelemetry.com"
          CODETELEMETRY_GATE: "IZy3oJUWHm5y2y_kp_Tejg"
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/codetelemetry-gate.json"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token available. The workflow needs 'permissions: id-token: write'."
            exit 1
          fi
          attempt=0
          unavailable=0
          for poll in $(seq 1 80); do
            oidc=$(curl -fsS --max-time 20 --get --data-urlencode "audience=$CODETELEMETRY_URL" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              | jq -r '.value // empty') || oidc=""
            if [ -z "$oidc" ]; then
              echo "::error::GitHub did not issue an OIDC token for this run."
              exit 1
            fi
            echo "::add-mask::$oidc"
            body=$(jq -cn --arg gate "$CODETELEMETRY_GATE" --arg sha "$HEAD_SHA" \
              --argjson pr "$PR_NUMBER" --argjson attempt "$attempt" \
              '{gate: $gate, pullRequest: $pr, headSha: $sha, attempt: $attempt}')
            status=$(curl -sS --max-time 120 -o "$out" -w '%{http_code}' -X POST \
              "$CODETELEMETRY_URL/api/integrations/github/gate/check" \
              -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
              --data "$body") || status=000
            message=$(jq -r '.description // .message // .error // empty' "$out" 2>/dev/null || true)
            case "$status" in
              200) unavailable=0 ;;
              000|429|500|502|503|504)
                unavailable=$((unavailable + 1))
                if [ "$unavailable" -ge 8 ]; then
                  echo "::error::CodeTelemetry is unavailable (HTTP $status). Re-run this job to try again."
                  exit 1
                fi
                echo "CodeTelemetry answered HTTP $status; retrying."
                sleep 15
                continue ;;
              *)
                echo "::error::CodeTelemetry refused the check (HTTP $status): ${message:-no detail}"
                exit 1 ;;
            esac
            state=$(jq -r '.state // empty' "$out" 2>/dev/null || true)
            case "$state" in
              pending)
                echo "${message:-Waiting for CodeTelemetry.}"
                wait=$(jq -r '(.retryAfterSeconds // 15) | floor | if . < 1 then 1 elif . > 300 then 300 else . end' "$out")
                attempt=$(jq -r --argjson a "$attempt" '.nextAttempt // $a' "$out")
                sleep "$wait" ;;
              success|failure|error)
                details=$(jq -r '.detailsUrl // empty' "$out")
                {
                  echo "### CodeTelemetry PR gate"
                  echo
                  echo "$message"
                  if [ -n "$details" ]; then echo; echo "[Open the deciding session]($details)"; fi
                } >> "$GITHUB_STEP_SUMMARY"
                if [ "$state" = "success" ]; then
                  echo "$message"
                  exit 0
                fi
                echo "::error::$message"
                exit 1 ;;
              *)
                echo "::error::CodeTelemetry sent an unexpected answer."
                exit 1 ;;
            esac
          done
          echo "::error::CodeTelemetry did not reach a verdict in time. Re-run this job to try again."
          exit 1
